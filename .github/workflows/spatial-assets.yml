name: Spatial asset preparation
on:
  push:
    branches: [newwebsite]
    paths: ['.github/workflows/spatial-assets.yml']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newwebsite
      - name: Fetch and validate actual GLB files
        run: |
          mkdir -p models
          for spec in robot-arm:v1 office-desk:v2 digital-camera:v1 quadruped-robot:v1; do
            slug=${spec%:*}
            version=${spec#*:}
            curl --fail --location --retry 2 --max-time 90 "https://tevy.dev/models/$slug/$version/lod0.glb" -o "models/$slug.glb"
          done
          python - <<'PY'
          import pathlib,struct,json
          for p in pathlib.Path('models').glob('*.glb'):
              b=p.read_bytes()
              assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2
              assert struct.unpack_from('<I',b,8)[0]==len(b)
              n=struct.unpack_from('<I',b,12)[0]
              d=json.loads(b[20:20+n])
              assert d.get('meshes')
              print(p,len(b),len(d['meshes']),d.get('extensionsRequired',[]))
          PY
      - name: Commit verified model bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --cached --quiet || git commit -m "Vendor validated spatial GLB assets"
          git push origin HEAD:newwebsite
