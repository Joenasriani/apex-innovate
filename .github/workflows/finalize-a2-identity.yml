name: Finalize A2 identity
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-a2-identity.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/layout.tsx')
          s=p.read_text().replace('https://ae.linkedin.com/in/joenasrprofile','https://www.linkedin.com/in/joenasrprofile')
          p.write_text(s)
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git rm .github/workflows/finalize-a2-identity.yml; git add src/app/layout.tsx; git commit -m "Normalize founder identity references"; git push
